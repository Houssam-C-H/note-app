name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: notespace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: cd apps/api && npx prisma generate
      
    - name: Push Database Schema
      run: cd apps/api && DATABASE_URL="postgresql://user:password@localhost:5432/notespace_test" npx prisma db push
      
    - name: Run API Tests
      run: cd apps/api && DATABASE_URL="postgresql://user:password@localhost:5432/notespace_test" npm run test

  test-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run Web Unit Tests
      run: cd apps/web && npm run test

  build:
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: cd apps/api && npx prisma generate
      
    - name: Build Web
      run: cd apps/web && npm run build
      
    - name: Build API
      run: cd apps/api && npm run build
