services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notespace_prod
      POSTGRES_USER: notespace
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prodpassword}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notespace -d notespace_prod"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${PROD_DB_PORT:-5434}:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    restart: always

  api:
    image: note-app-api:latest
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://notespace:${DB_PASSWORD:-prodpassword}@postgres:5432/notespace_prod
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecret_production_key_notespace}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:8080}
    ports:
      - "${PROD_API_PORT:-3002}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  web:
    image: note-app-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: always

volumes:
  postgres_data_prod:
  redis_data_prod:
